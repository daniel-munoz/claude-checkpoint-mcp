# Publishes a release when a v* tag is pushed:
#   1. npm: the `session-checkpoint-mcp` package, with provenance.
#   2. MCP registry: server.json as io.github.daniel-munoz/claude-checkpoint-mcp.
#
# Both steps are idempotent, so a failed release can be finished by running this workflow by hand
# (Actions → Publish → Run workflow, with the tag): a version already on npm is skipped.
#
# npm auth: set the NPM_TOKEN secret (needed for the first publish, since npm trusted publishing
# can only be configured once the package exists). Once trusted publishing is set up on
# npmjs.com for this repo and workflow, the secret can be removed and npm will use OIDC.
# MCP registry auth: GitHub OIDC, which proves this workflow runs in daniel-munoz/... (no secret).

name: Publish

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v0.3.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # npm provenance / trusted publishing, and mcp-publisher github-oidc login

env:
  MCP_PUBLISHER_VERSION: v1.8.7
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        registry-url: https://registry.npmjs.org

    - name: Check tag matches package version
      id: meta
      run: |
        name="$(node -p 'require("./package.json").name')"
        version="$(node -p 'require("./package.json").version')"
        if [ "${RELEASE_TAG}" != "v${version}" ]; then
          echo "::error::tag ${RELEASE_TAG} does not match package.json version ${version}"
          exit 1
        fi
        echo "name=${name}" >> "$GITHUB_OUTPUT"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    # The per-version URL is served fresh right after a publish, unlike the cached package document.
    - name: Check whether this version is already on npm
      id: npm
      run: |
        status="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${{ steps.meta.outputs.name }}/${{ steps.meta.outputs.version }}")"
        if [ "${status}" = "200" ]; then
          echo "::notice::${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} is already on npm; skipping npm publish"
          echo "published=true" >> "$GITHUB_OUTPUT"
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install
      run: npm ci

    # prepublishOnly runs typecheck, tests (including the metadata sync test) and build.
    - name: Publish to npm
      if: steps.npm.outputs.published != 'true'
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Install mcp-publisher
      run: |
        curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
          | tar xz mcp-publisher

    # The registry checks the version against npm's package document, which npm caches and can
    # serve stale for several minutes after a publish (v0.3.1 needed more than 2.5). Retry for ~10.
    - name: Publish to MCP registry
      run: |
        server_name="$(node -p 'require("./server.json").name')"
        status="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${server_name/\//%2F}/versions/${{ steps.meta.outputs.version }}")"
        if [ "${status}" = "200" ]; then
          echo "::notice::${server_name} ${{ steps.meta.outputs.version }} is already in the MCP registry; nothing to do"
          exit 0
        fi
        ./mcp-publisher login github-oidc
        for attempt in $(seq 1 20); do
          ./mcp-publisher publish && exit 0
          echo "attempt ${attempt}/20 failed; retrying in 30s"
          sleep 30
        done
        exit 1
